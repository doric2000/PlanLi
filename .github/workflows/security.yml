name: Security analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript

  semgrep:
    name: PlanLi security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.175.0

      - name: Scan repository-specific security invariants
        run: >-
          semgrep scan
          --metrics off
          --disable-version-check
          --x-rule-validation=core-only
          --jobs 2
          --timeout 30
          --max-memory 2048
          --exclude '*.test.js'
          --exclude '*.test.jsx'
          --exclude '*.test.ts'
          --exclude '*.test.tsx'
          --exclude __tests__
          --exclude node_modules
          --exclude hosting/admin
          --json-output semgrep.json
          --sarif-output semgrep.sarif
          --error
          --config .semgrep/planli-security.yml
          functions client/src client/index.js scripts

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep-planli

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download and verify Gitleaks 8.30.1
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan complete Git history
        run: >-
          ./gitleaks git
          --redact=100
          --report-format sarif
          --report-path gitleaks.sarif
          --exit-code 1
          --timeout 600
          --no-banner
          --no-color
          .

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-history

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  dependency-audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1

      - name: Resolve root development dependency metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit root dependency tree
        id: root_audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Audit client lockfile
        id: client_audit
        continue-on-error: true
        working-directory: client
        run: npm audit --audit-level=moderate

      - name: Audit Functions lockfile
        id: functions_audit
        continue-on-error: true
        working-directory: functions
        run: npm audit --audit-level=moderate

      - name: Verify generated legal policy artifacts
        run: npm run test:legal-policy

      - name: Require both dependency audits to pass
        if: always()
        env:
          ROOT_AUDIT: ${{ steps.root_audit.outcome }}
          CLIENT_AUDIT: ${{ steps.client_audit.outcome }}
          FUNCTIONS_AUDIT: ${{ steps.functions_audit.outcome }}
        run: |
          if [ "$ROOT_AUDIT" != "success" ] || [ "$CLIENT_AUDIT" != "success" ] || [ "$FUNCTIONS_AUDIT" != "success" ]; then
            echo "Dependency audit failed: root=$ROOT_AUDIT client=$CLIENT_AUDIT functions=$FUNCTIONS_AUDIT"
            exit 1
          fi
