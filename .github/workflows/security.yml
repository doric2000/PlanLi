name: Security analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
    - cron: '43 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.schedule }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan security checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codeql: ${{ steps.plan.outputs.codeql }}
      semgrep: ${{ steps.plan.outputs.semgrep }}
      secrets: ${{ steps.plan.outputs.secrets }}
      dependencyReview: ${{ steps.plan.outputs.dependencyReview }}
      dependencyAudit: ${{ steps.plan.outputs.dependencyAudit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for this event
        id: plan
        run: node scripts/securityCiPlan.js plan

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    needs: changes
    if: needs.changes.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript

  semgrep:
    name: Changed-source Semgrep
    needs: changes
    if: needs.changes.outputs.semgrep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select exact scan inputs
        run: node scripts/securityCiPlan.js plan

      - name: Use Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pinned Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.175.0

      - name: Scan repository-specific security invariants
        run: node scripts/securityCiPlan.js semgrep

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep-planli

  secrets:
    name: Full-history secret scan
    # Keep the existing check name for branch-protection compatibility.
    needs: changes
    if: needs.changes.outputs.secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select new commits or scheduled full history
        run: node scripts/securityCiPlan.js plan

      - name: Download and verify Gitleaks 8.30.1
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks

      - name: Scan selected Git history including merge additions
        run: node scripts/securityCiPlan.js secrets

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks-history

  dependency-review:
    name: Dependency review
    needs: changes
    if: needs.changes.outputs.dependencyReview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  dependency-audit:
    name: Locked dependency audit
    needs: changes
    if: needs.changes.outputs.dependencyAudit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select affected dependency trees
        run: node scripts/securityCiPlan.js plan

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1

      - name: Test dependency audit policy
        run: node --test scripts/verifyDependencyAudit.test.js

      - name: Audit selected dependency trees
        run: node scripts/securityCiPlan.js audit

  security-policy:
    # Preserve the existing required check name for this always-running aggregate.
    name: PlanLi security invariants
    if: always()
    needs: [changes, codeql, semgrep, secrets, dependency-review, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed or cancelled checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS); if(n.changes.result!=="success" || Object.values(n).some(j=>!["success","skipped"].includes(j.result))) process.exit(1)'
