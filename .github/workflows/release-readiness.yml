name: Release readiness (manual)

on:
  workflow_dispatch:
    inputs:
      current_production_commit:
        description: Git commit recorded by the latest production EAS Update group
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-lineage:
    name: Production update lineage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1

      - name: Prevent production update rollback
        run: >-
          node scripts/easProductionPreflight.js
          --deployed-commit "${{ inputs.current_production_commit }}"

  client:
    name: Client and iOS export
    needs: production-lineage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify iOS native build readiness
        run: npm run verify:ios-build-readiness

      - name: Run client tests
        run: npm test -- --runInBand

      - name: Export the iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir .expo-validation/ci-ios

      - name: Reject critical production advisories
        run: npm audit --omit=dev --audit-level=critical

  functions:
    name: Functions and Firebase Rules
    needs: production-lineage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.1

      - name: Run Functions tests
        run: npm test

      - name: Run Firestore and Storage Rules emulator tests
        run: npm run test:rules:emulator

      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
