name: Release readiness (manual)

on:
  workflow_dispatch:
    inputs:
      validation_kind:
        description: Validate affected components; full explicitly checks the whole release
        type: choice
        options: [ota, build, full]
        default: ota
      platform:
        description: Native platform to validate
        type: choice
        options: [ios, android]
        default: ios
      current_production_commit:
        description: Git commit recorded by the latest production EAS Update group
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-lineage:
    name: Production update lineage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      rules: ${{ steps.plan.outputs.rules }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1

      - name: Prevent production update rollback
        env:
          DEPLOYED_COMMIT: ${{ inputs.current_production_commit }}
        run: >-
          node scripts/easProductionPreflight.js
          --deployed-commit "$DEPLOYED_COMMIT"

      - name: Select affected release components
        id: plan
        env:
          RELEASE_KIND: ${{ inputs.validation_kind }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_BASE: ${{ inputs.current_production_commit }}
        run: node scripts/releaseReadiness.js --kind "$RELEASE_KIND" --platform "$RELEASE_PLATFORM" --base "$RELEASE_BASE" --scope plan

  client:
    name: Client and iOS export
    needs: production-lineage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate the selected release type
        working-directory: .
        env:
          RELEASE_KIND: ${{ inputs.validation_kind }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_BASE: ${{ inputs.current_production_commit }}
        run: node scripts/releaseReadiness.js --kind "$RELEASE_KIND" --platform "$RELEASE_PLATFORM" --base "$RELEASE_BASE" --scope client

  functions:
    name: Functions and Firebase Rules
    needs: production-lineage
    if: needs.production-lineage.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Use Java 21 for Firebase emulators
        if: needs.production-lineage.outputs.rules == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Firebase CLI
        if: needs.production-lineage.outputs.rules == 'true'
        run: npm install --global firebase-tools@15.25.1

      - name: Validate affected backend components
        working-directory: .
        env:
          RELEASE_KIND: ${{ inputs.validation_kind }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_BASE: ${{ inputs.current_production_commit }}
        run: node scripts/releaseReadiness.js --kind "$RELEASE_KIND" --platform "$RELEASE_PLATFORM" --base "$RELEASE_BASE" --scope backend
