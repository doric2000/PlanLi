name: Release readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client and iOS export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify iOS release configuration
        run: npm run verify:ios-release

      - name: Run client tests
        run: npm test -- --runInBand

      - name: Export the iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir .expo-validation/ci-ios

      - name: Reject critical production advisories
        run: npm audit --omit=dev --audit-level=critical

  functions:
    name: Functions and Firebase Rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.25.1

      - name: Run Functions tests
        run: npm test

      - name: Run Firestore and Storage Rules emulator tests
        run: npm run test:rules:emulator

      - name: Reject high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
