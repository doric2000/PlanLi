appId: com.planli.planlitravels.e2e
---
- runFlow:
    when:
      visible: "דילוג על הסיור|דילוג על ההדרכה"
    commands:
      - tapOn: "דילוג על הסיור|דילוג על ההדרכה"
      - extendedWaitUntil:
          notVisible:
            id: "noya-tour-overlay-.*"
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 5000
