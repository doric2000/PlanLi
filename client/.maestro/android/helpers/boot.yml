appId: com.planli.planlitravels.e2e
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"
# Open the explicit local URL directly; LAN discovery and the development
# launcher's labels are not prerequisites for exercising the application.
- openLink: "com.planli.planlitravels.e2e://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 300000
- tapOn: "Continue"
# The SDK 57 floating developer button otherwise covers real app controls.
- scrollUntilVisible:
    element:
      text: Tools button
    direction: DOWN
- tapOn: Tools button
- tapOn: "Close"
# Some SDK 57 runs leave the native menu open after the Close accessibility tap.
# Android Back dismisses that menu; never send it after the app is already visible.
- runFlow:
    when:
      visible: "Go home"
    commands:
      - back
- extendedWaitUntil:
    notVisible: "Go home"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: region-selector-screen
    timeout: 300000
- tapOn:
    text: "עצירת סיבוב אוטומטי"
    optional: true
- tapOn: "האזור הבא"
- tapOn: "האזור הבא"
- assertVisible: "לגלות את אירופה"
- tapOn:
    id: atlas-confirm
- extendedWaitUntil:
    visible:
      id: home-tab-header
    timeout: 60000
- extendedWaitUntil:
    visible: "דילוג על הסיור"
    timeout: 120000
- runFlow: dismiss-tour.yml
