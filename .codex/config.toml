# Project-scoped MCP configuration for trusted PlanLi workspaces.
# Authentication remains user-local; no credentials belong in this file.

[mcp_servers.firebase]
command = "npx"
args = ["-y", "firebase-tools@latest", "mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 120
required = false

[mcp_servers.expo]
url = "https://mcp.expo.dev/mcp"
auth = "oauth"
startup_timeout_sec = 20
tool_timeout_sec = 120
required = false
