<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#1E3A5F">
  <title>טיול פרטי ב־PlanLi</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/trip/styles.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <img class="wordmark" src="/assets/brand-wordmark.png" alt="PlanLi Travels">
      <div class="map" aria-hidden="true">
        <span class="route route-a"></span><span class="route route-b"></span>
        <span class="pin pin-a">1</span><span class="pin pin-b">2</span><span class="pin pin-c">3</span>
      </div>
      <p class="eyebrow">קישור פרטי</p>
      <h1 id="title">הטיול מחכה לך באפליקציה</h1>
      <p>מתחברים ל־PlanLi וצופים בימים, בעצירות ובמפה. הטיול נשאר פרטי ואי אפשר לערוך את המקור.</p>
      <button id="open-app" type="button">פתיחה ב־PlanLi</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <a class="home" href="/">חזרה לאתר PlanLi</a>
    </section>
  </main>
  <script src="/trip/app.js" defer></script>
</body>
</html>
