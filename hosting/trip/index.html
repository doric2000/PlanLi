<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#1E3A5F">
  <meta name="referrer" content="no-referrer">
  <title>שותף איתך ב־PlanLi</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/trip/styles.css">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <img class="wordmark" src="/assets/brand-wordmark.png" alt="PlanLi Travels">
      <div class="map" aria-hidden="true">
        <span class="route route-a"></span><span class="route route-b"></span>
        <span class="pin pin-a">1</span><span class="pin pin-b">2</span><span class="pin pin-c">3</span>
      </div>
      <p class="eyebrow" id="eyebrow">שותף איתך ב־PlanLi</p>
      <h1 id="title">מחכה לך באפליקציה</h1>
      <p id="description">פותחים את PlanLi כדי לראות את התוכן ששותף איתך.</p>
      <button id="open-app" type="button" disabled>פתיחה ב־PlanLi</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="stores" aria-label="התקנה או עדכון של PlanLi">
        <a id="ios-store" href="https://apps.apple.com/il/app/planli-travels/id6801453067" rel="noopener noreferrer">הורדה ל־iPhone</a>
        <a id="android-store" href="https://play.google.com/store/apps/details?id=com.planli.planlitravels" rel="noopener noreferrer">הורדה ל־Android</a>
      </div>
      <p class="install-note">אחרי ההתקנה או העדכון, חזרו להודעה ולחצו שוב על הקישור המקורי.</p>
      <noscript><p>כדי לפתוח את הקישור, יש לאפשר JavaScript בדפדפן.</p></noscript>
      <a class="home" href="/">חזרה לאתר PlanLi</a>
    </section>
  </main>
  <script src="/assets/public-links.generated.js" defer></script>
  <script src="/trip/app.js" defer></script>
</body>
</html>
