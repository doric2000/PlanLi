<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#17334f" />
    <meta name="description" content="PlanLi מחברת בין המלצות ממטיילים, מקומות שאהבתם ותכנון מסלול — הכול במקום אחד." />
    <link rel="canonical" href="https://planli.cc/" />
    <title>PlanLi — יותר לטייל, פחות להתפזר</title>
    <link rel="icon" href="assets/brand/mark.png" type="image/png" />
    <link rel="stylesheet" href="round-2.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">דלגו לתוכן</a>
    <main id="main" class="hero concept-stay">
      <header class="topbar" aria-label="PlanLi">
        <span class="brand" aria-label="PlanLi">
          <img src="assets/brand/mark.png" width="43" height="45" alt="" />
          <span class="brand-name">Plan<em>Li</em></span>
        </span>
      </header>

      <section class="hero-grid" aria-labelledby="stay-title">
        <div class="hero-copy copy-panel">
          <h1 id="stay-title">יותר לטייל.<br /><span class="accent">פחות להתפזר.</span></h1>
          <p>הקהילה, המקומות והמסלול שלכם נפגשים במקום אחד — כדי שתוכלו להישאר בתוך הטיול.</p>
          <div class="store-row" aria-label="אפשרויות הורדה">
            <span class="app-store-badge" role="img" aria-label="זמין ב־App Store">
              <img src="assets/brand/app-store-badge.svg" width="157" height="54" alt="זמין ב־App Store" />
            </span>
            <span class="store-unavailable" aria-disabled="true"><span><small>בקרוב ב־</small>Google Play</span></span>
          </div>
        </div>

        <figure class="visual-stage stay-stage" aria-label="מסכי קהילה ומפה באפליקציית PlanLi">
          <div class="stay-caption">המלצות ממטיילים אמיתיים, בדרך אל היום שלכם.</div>
          <div class="device device-community">
            <img src="assets/screens-real/community.webp" width="589" height="1280" alt="מסך הקהילה האמיתי של PlanLi" />
          </div>
          <div class="device device-map">
            <img src="assets/screens-real/route-map.webp" width="589" height="1280" alt="מפת מסלול אמיתית ב־PlanLi" />
          </div>
        </figure>
      </section>
    </main>
  </body>
</html>
